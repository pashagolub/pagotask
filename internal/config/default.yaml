# pagotask configuration. Edited by hand; changes apply live.

hotkey: Win+Shift+T
default_list: p

# Single-letter key -> Google Tasks list title (must match the list name in Google Tasks).
lists:
  w: Work
  f: Family
  p: Personal
  c: Community

# Tag id -> emoji template. The id (or an explicit `key`) is the word you type
# first in the title line: "pr pgwatch #345", "call mom", "mail invoice".
# `aliases` are more words for the same tag: "run 5k" and "swim" both get ⏱️.
tags:
  talk:      { emoji: "🎤" }
  video:     { emoji: "🎥" }
  release:   { emoji: "🏗️", list: w }
  home:      { emoji: "🏠", list: f }
  family:    { emoji: "👨‍👩‍👧‍👦", list: f }
  health:    { emoji: "💉" }
  chat:      { emoji: "💬" }
  finance:   { emoji: "💰" }
  walk:      { emoji: "⏱️", aliases: [run, swim, hike, bike] }
  forms:     { emoji: "✅" }
  checkin:   { emoji: "✈️" }
  is:        { emoji: "🇮🇸", list: c, aliases: [issue] }
  pr:        { emoji: "🇵🇷", list: c, aliases: [pull] }
  translate: { emoji: "🈶" }
  research:  { emoji: "🎓" }
  paper:     { emoji: "💼" }
  write:     { emoji: "📝" }
  call:      { emoji: "📞" }
  mail:      { emoji: "📫", aliases: [email] }
  auto:      { emoji: "🚐" }
  shop:      { emoji: "🛒" }
  fix:       { emoji: "🛠️" }
  tourism:   { emoji: "🥾" }

# Process name -> what to read from that application when it is in front.
#   read: url    address bar and window title; URL and title rules apply, and
#                with no matching rule the popup gets the page title + URL
#   read: title  window title only; title rules apply (same as an unlisted app)
#   read: control, control: <id or name>
#                text of one field (e.g. a mail subject); it stands in for the
#                window title in title rules and prefills the popup. To find a
#                field's id, set read: control with any control value, click
#                into the field, press the hotkey and look for "focused control"
#                in pagotask.log.
#   read: none   nothing; the popup opens empty
# Process names are as in Task Manager's Details tab, e.g. brave.exe. On
# Linux they are the program's file name, e.g. firefox, chrome, code.
sources:
  firefox.exe: { read: url }
  chrome.exe:  { read: url }
  msedge.exe:  { read: url }
  Code.exe:    { read: title }
  firefox:     { read: url }
  chrome:      { read: url }
  chromium:    { read: url }
  msedge:      { read: url }
  code:        { read: title }

# First matching rule wins. {1}, {2}... are regexp capture groups.
rules:
  - match: 'github\.com/([^/]+)/([^/]+)/pull/(\d+)'
    tag: pr
    title: "{2} #{3}"
    list: { "cybertec-postgresql/": w }
  - match: 'github\.com/([^/]+)/([^/]+)/issues/(\d+)'
    tag: is
    title: "{2} #{3}"
    list: { "cybertec-postgresql/": w }
  # Fallbacks when the address bar can't be read: GitHub tab titles end
  # with "· Pull Request #6 · owner/repo".
  - match: '· Pull Request #(\d+) · ([^/\s]+)/([^/\s]+)'
    on: title
    tag: pr
    title: "{3} #{1}"
    list: { "cybertec-postgresql/": w }
  - match: '· Issue #(\d+) · ([^/\s]+)/([^/\s]+)'
    on: title
    tag: is
    title: "{3} #{1}"
    list: { "cybertec-postgresql/": w }

# Optional: bring your own Google OAuth desktop client.
# google:
#   client_id: ...
#   client_secret: ...

# The open-tasks popup: check tasks off from the keyboard.
tasks:
  hotkey: Win+Shift+D
  lists: [w, f, p, c]   # list keys to show; leave out to show every list above
  refresh: 5m           # background refresh from Google (minimum 1m)
