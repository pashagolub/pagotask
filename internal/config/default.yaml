# pagotask configuration. Edited by hand; changes apply live.

hotkey: Win+Shift+T
default_list: p

# Single-letter key -> Google Tasks list title (must match the list name in Google Tasks).
lists:
  w: Work
  f: Family
  p: Personal
  c: Community

# Tag id -> emoji template. The id (or an explicit `key`) is the word you type
# first in the title line: "pr pgwatch #345", "call mom", "mail invoice".
tags:
  talk:      { emoji: "🎤" }
  video:     { emoji: "🎥" }
  release:   { emoji: "🏗️", list: w }
  home:      { emoji: "🏠", list: f }
  family:    { emoji: "👨‍👩‍👧‍👦", list: f }
  health:    { emoji: "💉" }
  chat:      { emoji: "💬" }
  finance:   { emoji: "💰" }
  walk:      { emoji: "⏱️" }
  forms:     { emoji: "✅" }
  checkin:   { emoji: "✈️" }
  is:        { emoji: "🇮🇸", list: c }
  pr:        { emoji: "🇵🇷", list: c }
  translate: { emoji: "🈶" }
  research:  { emoji: "🎓" }
  paper:     { emoji: "💼" }
  write:     { emoji: "📝" }
  call:      { emoji: "📞" }
  mail:      { emoji: "📫" }
  auto:      { emoji: "🚐" }
  shop:      { emoji: "🛒" }
  fix:       { emoji: "🛠️" }
  tourism:   { emoji: "🥾" }

# Process name -> what to read from that application when it is in front.
sources:
  firefox.exe: { read: url }
  chrome.exe:  { read: url }
  msedge.exe:  { read: url }
  Code.exe:    { read: title }

# First matching rule wins. {1}, {2}... are regexp capture groups.
rules:
  - match: 'github\.com/([^/]+)/([^/]+)/pull/(\d+)'
    tag: pr
    title: "{2} #{3}"
    list: { "cybertec-postgresql/": w }
  - match: 'github\.com/([^/]+)/([^/]+)/issues/(\d+)'
    tag: is
    title: "{2} #{3}"
    list: { "cybertec-postgresql/": w }

# Optional: bring your own Google OAuth desktop client.
# google:
#   client_id: ...
#   client_secret: ...
