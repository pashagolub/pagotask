name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile for Windows
        run: GOOS=windows GOARCH=amd64 go build -tags desktop,production -ldflags "-H windowsgui" -o dist/pagotask.exe ./cmd/pagotask
      - uses: actions/upload-artifact@v4
        with:
          name: pagotask-windows-amd64
          path: dist/pagotask.exe
